<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" role="img">
  <title>Open Flight paper saddle</title>
  <desc>An illustrated paper saddle with two dashed fold lines sits above a folded paper glider. The assembled form spans the central crease.</desc>
