name: Publish Open Flight on Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: bun scripts/check_site.mjs docs
  deploy:
    needs: verify
    if: github.repository == 'kevinmamaqi/open-flight' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Start the main-branch Pages build
        env:
          DEPLOY_HOOK: ${{ secrets.OPEN_FLIGHT_PAGES_DEPLOY_HOOK }}
        run: curl --proto '=https' --fail --silent --show-error --output /dev/null --request POST "$DEPLOY_HOOK"
